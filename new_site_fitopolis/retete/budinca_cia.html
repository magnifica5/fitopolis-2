<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel = "stylesheet" href = "style_retete.css">
    <title>Budincă de chia cu fructe</title>
  </head>
  <body>
    <div class="container justify-content-center mt-4" style="display: flex; flex-direction: column;">
      <div class="justify-content-center" style="margin-bottom: 70px;">
        <h1 class="q1 titlu">Budincă de chia cu fructe</h1>
        <img src="pozw\budinca_cia.jpeg" class="img">
        <div class="row m-0 p-2" style="background-color: white;">
          <div class = "col-4 details" style="border-right: 2px solid rgb(133, 132, 132); font-size: 25px; text-align: center;">&#128337; 10 min</div>
          <div class = "col-4 details" style="border-right: 2px solid rgb(133, 132, 132); font-size: 25px; text-align: center;">&#x2705; Ușor</div>
          <div class = "col-4 details" style="font-size: 25px; text-align: center;">&#x1F525; 290 kcal</div>
        </div>
        <div class="r">
          <div class="row mt-5 ml-0 mr-0 mb-3">
          <div class="col-12 col-md-5 p-3 text" style="display: flex; flex-direction: column; background-color: white;">
            <h3 style="color: #2F7F39;" class="q2">
              Ingrediente:
            </h3>
            <p style="padding-left: 20px;">
              •	2 linguri semințe chia<br>
	•	150 ml lapte<br>
	•	fructe (mango, căpșuni, banană)<br>
            </p>
          </div>
          <div class="col-2"></div>
          <div class="col-12 col-md-5 p-3 text" style="display: flex; flex-direction: column; background-color: white;">
            <h3 style="color: #2F7F39;" class="q2">
            Mod de Preparare:
            </h3>
            <p style="padding-left: 20px;">
              1. Amesteci chia cu laptele.<br>
              2. Lași la frigider peste noapte. <br>
              3. Dimineața adaugi fructele. <br>
            </p>
          </div>
        </div>
      </div>
    </div>
    </div>
