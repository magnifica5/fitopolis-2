<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmare Reușită | Fitopolis</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2e7d32;
            --text-color: #333;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }

        .success-icon {
            background: var(--primary-color);
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 20px;
            animation: scaleIn 0.5s ease-out;
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        .instruction {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            color: var(--secondary-color);
            border: 1px dashed var(--primary-color);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Cont Confirmat!</h1>
        <p>Email-ul tău a fost verificat cu succes.</p>
        
        <div class="instruction">
           Redeschide aplicația pentru a te loga.
        </div>

        <div class="footer">
            Echipa Fitopolis &copy; 2026
        </div>
    </div>

</body>
</html>
